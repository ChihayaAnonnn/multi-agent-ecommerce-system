[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "legacy"
markers = [
    "mysql: 依赖显式配置的独立 MySQL 测试库",
    "redis: 依赖显式配置的隔离 Redis 测试实例",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.layering]
layout = "packaged"
require_complete_inventory = true

[tool.importlinter]
root_packages = ["ecom"]
include_namespace_packages = true
include_external_packages = true

[[tool.importlinter.contracts]]
name = "业务与应用能力不得依赖 HTTP 层"
type = "forbidden"
source_modules = ["ecom.application", "ecom.modules.cart", "ecom.modules.catalog", "ecom.modules.checkout", "ecom.modules.events", "ecom.modules.identity", "ecom.modules.inventory", "ecom.modules.pricing", "ecom.modules.sale_facts", "ecom.modules.sessions"]
forbidden_modules = ["ecom.api"]

[[tool.importlinter.contracts]]
name = "shared 不得依赖配置或业务包"
type = "forbidden"
source_modules = ["ecom.shared"]
forbidden_modules = ["ecom.api", "ecom.application", "ecom.config", "ecom.infra", "ecom.kernel", "ecom.legacy", "ecom.modules", "migrations", "tools"]

[[tool.importlinter.contracts]]
name = "kernel 只允许基础 schemas 与 shared"
type = "forbidden"
source_modules = ["ecom.kernel"]
forbidden_modules = ["ecom.api", "ecom.application", "ecom.config", "ecom.infra", "ecom.legacy", "ecom.modules", "migrations", "tools"]
ignore_imports = ["ecom.kernel.constraints -> ecom.modules.catalog.schemas", "ecom.kernel.constraints -> ecom.modules.pricing.schemas", "ecom.kernel.quotes -> ecom.modules.catalog.schemas", "ecom.kernel.quotes -> ecom.modules.inventory.schemas", "ecom.kernel.quotes -> ecom.modules.pricing.schemas"]
unmatched_ignore_imports_alerting = "none"

