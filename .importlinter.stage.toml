[tool.importlinter]
root_packages = ["api", "application", "config", "data", "infra", "kernel", "legacy", "migrations", "modules", "scripts", "shared"]
include_namespace_packages = true

[[tool.importlinter.contracts]]
name = "业务与应用能力不得依赖 HTTP 层"
type = "forbidden"
source_modules = ["application", "modules.cart", "modules.catalog", "modules.checkout", "modules.events", "modules.identity", "modules.inventory", "modules.pricing", "modules.sale_facts", "modules.sessions"]
forbidden_modules = ["api"]

[[tool.importlinter.contracts]]
name = "shared 不得依赖配置或业务包"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["api", "application", "config", "data", "infra", "kernel", "legacy", "migrations", "modules", "scripts"]

[[tool.importlinter.contracts]]
name = "kernel 只允许基础 schemas 与 shared"
type = "forbidden"
source_modules = ["kernel"]
forbidden_modules = ["api", "application", "config", "data", "infra", "legacy", "migrations", "modules", "scripts"]
ignore_imports = ["kernel.constraints -> modules.catalog.schemas", "kernel.constraints -> modules.pricing.schemas", "kernel.quotes -> modules.catalog.schemas", "kernel.quotes -> modules.inventory.schemas", "kernel.quotes -> modules.pricing.schemas"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "基础 schemas 不得反向依赖 kernel"
type = "forbidden"
source_modules = ["modules.catalog.schemas", "modules.inventory.schemas", "modules.pricing.schemas"]
forbidden_modules = ["kernel"]

[[tool.importlinter.contracts]]
name = "sessions 不得依赖应用响应契约"
type = "forbidden"
source_modules = ["modules.sessions"]
forbidden_modules = ["api.contracts.commerce", "application"]

[[tool.importlinter.contracts]]
name = "业务事实能力不得依赖应用事实读取"
type = "forbidden"
source_modules = ["application.storefront", "modules.cart", "modules.sale_facts"]
forbidden_modules = ["application.shopping"]

[[tool.importlinter.contracts]]
name = "cart 不得协调会话和应用层"
type = "forbidden"
source_modules = ["modules.cart"]
forbidden_modules = ["application", "modules.sessions"]

[[tool.importlinter.contracts]]
name = "checkout 不得协调会话和应用层"
type = "forbidden"
source_modules = ["modules.checkout"]
forbidden_modules = ["application", "modules.sessions"]

[[tool.importlinter.contracts]]
name = "checkout 业务服务不得依赖宿主适配器"
type = "forbidden"
source_modules = ["modules.checkout.service"]
forbidden_modules = ["infra.checkout_gateway"]

[[tool.importlinter.contracts]]
name = "模型端口与 guards 不得依赖具体模型适配器"
type = "forbidden"
source_modules = ["application.shopping.guards", "application.shopping.ports"]
forbidden_modules = ["infra.llm"]

[[tool.importlinter.contracts]]
name = "orchestrator 不得构造具体图与模型适配器"
type = "forbidden"
source_modules = ["application.shopping.orchestrator"]
forbidden_modules = ["application.shopping.graph", "infra.llm"]

[[tool.importlinter.contracts]]
name = "模块与应用不得间接依赖具体基础设施或旧栈"
type = "forbidden"
source_modules = ["application.shopping", "application.shopping.actions", "application.shopping.compare", "application.shopping.contracts", "application.shopping.discovery", "application.shopping.facts", "application.shopping.graph", "application.shopping.guards", "application.shopping.intent", "application.shopping.nodes", "application.shopping.orchestrator", "application.shopping.ports", "application.shopping.schemas", "application.shopping.state", "application.storefront", "application.storefront.schemas", "application.storefront.service", "modules.cart", "modules.cart.models", "modules.cart.schemas", "modules.cart.service", "modules.catalog", "modules.catalog.models", "modules.catalog.ports", "modules.catalog.schemas", "modules.catalog.seed", "modules.catalog.service", "modules.checkout", "modules.checkout.models", "modules.checkout.ports", "modules.checkout.schemas", "modules.checkout.service", "modules.events", "modules.events.models", "modules.events.schemas", "modules.events.service", "modules.identity", "modules.identity.csrf", "modules.identity.models", "modules.identity.passwords", "modules.identity.rate_limit", "modules.identity.service", "modules.identity.tokens", "modules.identity.types", "modules.inventory", "modules.inventory.models", "modules.inventory.schemas", "modules.inventory.seed", "modules.inventory.service", "modules.pricing", "modules.pricing.models", "modules.pricing.schemas", "modules.pricing.seed", "modules.pricing.service", "modules.sale_facts", "modules.sale_facts.service", "modules.sessions", "modules.sessions.models", "modules.sessions.schemas", "modules.sessions.service"]
