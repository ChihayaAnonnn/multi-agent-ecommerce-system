<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>购物助手</title>
<link rel="stylesheet" href="/demo/commerce.css">
<script src="/demo/commerce.js" defer></script>
</head>
<body>
<div id="shell" class="shell">
  <aside id="sidebar" class="sidebar" aria-label="会话记录">
    <div class="sidebar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">购</span><span>购物助手</span></div>
      <button id="new-session" class="new-chat" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建对话
      </button>
      <div class="history-heading">会话记录</div>
      <nav id="history" class="history" aria-label="历史对话"><p class="history-empty">对话会保存在这里</p></nav>
      <p class="sidebar-note">从一句需求开始。</p>
    </div>
  </aside>
  <main id="conversation" class="conversation empty">
    <header class="topbar">
      <button id="toggle-sidebar" class="icon-button" aria-label="收起会话记录" aria-controls="sidebar" aria-expanded="true" title="收起会话记录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <span class="page-title">购物助手</span>
    </header>
    <div class="chat-stage">
      <div id="welcome" class="welcome"><h1>今天想买什么？</h1></div>
      <div id="messages" class="messages" role="log" aria-label="对话内容" aria-live="polite" aria-relevant="additions text"></div>
      <div class="composer-zone">
        <form id="shop-form" class="composer">
          <label for="message" class="visually-hidden">输入购物需求</label>
          <textarea id="message" rows="1" maxlength="2000" placeholder="描述你的购物需求…" disabled></textarea>
          <div class="composer-bottom">
            <span id="status" class="composer-status" role="status">正在准备对话…</span>
            <button id="send" class="send-button" type="submit" aria-label="发送消息" title="发送消息" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </form>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
        <p class="composer-note">购物操作会先与你确认。</p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
