[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# 数据库 URL 留空，由 migrations/env.py 从 ECOM_DATABASE_URL 读取，
# 或由调用方通过 cfg.set_main_option("sqlalchemy.url", ...) 注入（测试库即走这条路）。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
